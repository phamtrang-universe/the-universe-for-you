<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universe</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      height: 100%;
      width: 100%;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2.5rem;
      font-family: 'Helvetica Neue', sans-serif;
      opacity: 0;
      transition: opacity 2s ease;
      text-shadow: 0 0 25px #fff;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <canvas id="universe"></canvas>
  <div id="message">In this universe, only you shine this bright.</div>

  <script>
    const canvas = document.getElementById("universe");
    const ctx = canvas.getContext("2d");

    canvas.width = innerWidth;
    canvas.height = innerHeight;

    // --- 3D Galaxy Starfield ---
    const stars = [];
    const STAR_COUNT = 800;

    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * canvas.width - canvas.width / 2,
        y: Math.random() * canvas.height - canvas.height / 2,
        z: Math.random() * 2000,
      });
    }

    function animateGalaxy() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach((star) => {
        star.z -= 4;
        if (star.z <= 0) star.z = 2000;

        const k = 300 / star.z;
        const sx = star.x * k + canvas.width / 2;
        const sy = star.y * k + canvas.height / 2;

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(sx, sy, k * 1.2, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animateGalaxy);
    }

    animateGalaxy();

    // --- Scorpio constellation (points) ---
    const scorpioStars = [
      { x: 0.15, y: 0.25 },
      { x: 0.28, y: 0.32 },
      { x: 0.40, y: 0.40 },
      { x: 0.50, y: 0.55 },
      { x: 0.58, y: 0.70 },
      { x: 0.66, y: 0.80 },
      { x: 0.74, y: 0.88 }
    ];

    let touched = false;

    canvas.addEventListener("click", () => {
      if (touched) return;
      touched = true;
      drawLines();
    });

    function drawLines() {
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 2;
      let i = 0;

      function drawStep() {
        if (i >= scorpioStars.length - 1) {
          showMessage();
          setTimeout(starExplosion, 2000);
          return;
        }

        const A = scorpioStars[i];
        const B = scorpioStars[i + 1];

        ctx.beginPath();
        ctx.moveTo(A.x * canvas.width, A.y * canvas.height);
        ctx.lineTo(B.x * canvas.width, B.y * canvas.height);
        ctx.stroke();

        i++;
        setTimeout(drawStep, 350);
      }

      drawStep();
    }

    // --- Message fade in ---
    function showMessage() {
      document.getElementById("message").style.opacity = 1;
    }

    // --- Star explosion → redirect ---
    function starExplosion() {
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          ctx.fillStyle = `rgba(255,255,255,${Math.random()})`;
          ctx.beginPath();
          ctx.arc(
            canvas.width / 2,
            canvas.height / 2,
            50 + Math.random() * 300,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }, i * 50);
      }

      setTimeout(() => {
        window.location.href = "message.html";
      }, 2600);
    }
  </script>
</body>
</html>
