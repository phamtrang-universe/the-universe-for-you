<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Universe For You</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Galaxy background -->
    <canvas id="galaxy"></canvas>

    <!-- Constellation -->
    <svg id="scorpio" width="100%" height="100%">
        <!-- Stars -->
        <circle class="star" cx="50%" cy="20%" r="3"></circle>
        <circle class="star" cx="60%" cy="28%" r="3"></circle>
        <circle class="star" cx="62%" cy="40%" r="3"></circle>
        <circle class="star" cx="58%" cy="55%" r="3"></circle>
        <circle class="star" cx="55%" cy="65%" r="3"></circle>
        <circle class="star" cx="50%" cy="75%" r="3"></circle>

        <!-- Lines (hidden first) -->
        <polyline id="connect-line"
                  points="50,20 60,28 62,40 58,55 55,65 50,75"
                  stroke="rgba(255,255,255,0.8)"
                  stroke-width="2"
                  fill="none"
                  stroke-dasharray="400"
                  stroke-dashoffset="400">
        </polyline>
    </svg>

    <!-- Intro text -->
    <div id="intro">
        <span class="typing">Connecting your stars…</span>
    </div>

    <!-- Explosion flash -->
    <div id="flash"></div>

    <script src="script.js"></script>
</body>
</html>
