<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe for Trang</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js for 3D Universe -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r157/three.min.js"></script>
</head>
<body>

    <!-- Galaxy + Constellation Layer -->
    <canvas id="constellationCanvas"></canvas>

    <!-- UI text -->
    <div id="ui">
        <div id="headline">Connect your stars...</div>
        <div id="hint">Tap the glowing points</div>
    </div>

    <!-- 3D Universe (hidden at first) -->
    <div id="universe3D" style="display:none;">
        <canvas id="universeCanvas"></canvas>
    </div>

    <!-- Transition Flash -->
    <div id="flash"></div>

    <!-- Loading text for galaxy reveal -->
    <div id="loadingText">Entering your universe...</div>

    <script src="scripts.js"></script>
</body>
</html>
