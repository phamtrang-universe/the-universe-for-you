<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Universe for Trang — Particle Reveal</title>

  <!-- CSS (create style.css next) -->
  <link rel="stylesheet" href="style.css">

  <meta name="theme-color" content="#020118">
</head>
<body>

  <!-- 2D layer: constellation + initial starfield -->
  <canvas id="stage" aria-label="Constellation canvas"></canvas>

  <!-- UI overlay -->
  <div id="ui">
    <div id="headline">Connect the stars of Scorpius</div>
    <div id="hint">Tap each glowing point in order</div>
  </div>

  <!-- Flash / explosion overlays -->
  <div id="flash"></div>
  <div id="particleLayer" aria-hidden="true"></div>

  <!-- Final message (hidden until after explosion) -->
  <div id="finalMessage" aria-hidden="true">In this universe, only you shine this bright.</div>

  <!-- Script (create scripts.js next) -->
  <script src="scripts.js" defer></script>
</body>
</html>
