<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorpio Universe</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 20% 30%, #0f0f25, #050514);
            font-family: "Inter", sans-serif;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        #titleText {
            position: fixed;
            top: 8%;
            width: 100%;
            text-align: center;
            font-size: 26px;
            letter-spacing: 1px;
            opacity: 0.9;
            color: #c7d8ff;
        }

        #hint {
            position: fixed;
            bottom: 5%;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #868bad;
            opacity: 0.7;
        }

        #finalMessage {
            position: fixed;
            bottom: 15%;
            width: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: 500;
            color: #ffffff;
            opacity: 0;
            transform: translateY(20px);
            transition: 1s ease;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="titleText">Connecting your stars...</div>

    <canvas id="starCanvas"></canvas>

    <div id="finalMessage">In this universe, only you shine this bright.</div>
    <div id="hint">Tap anywhere to connect the stars</div>

    <script src="scripts.js"></script>
</body>
</html>
