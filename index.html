<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Universe for Trang</title>

  <!-- link to external CSS -->
  <link rel="stylesheet" href="style.css">

  <meta name="theme-color" content="#050418">
</head>
<body>
  <!-- Canvas for galaxy animation -->
  <canvas id="starCanvas" aria-label="Galaxy background"></canvas>

  <!-- Intro UI -->
  <header id="ui">
    <div id="headline">Connecting your stars...</div>
    <div id="hint">Tap anywhere to connect the stars</div>
  </header>

  <!-- Final message (hidden at first) -->
  <div id="finalMessage" role="status" aria-hidden="true">
    In this universe, only you shine this bright.
  </div>

  <!-- Script -->
  <script src="script.js" defer></script>
</body>
</html>
